services:
  - type: web
    name: tp7-app
    env: docker
    region: ohio
    plan: free
    
    # Build command
    dockerfilePath: ./demo/Dockerfile
    
    # Environment variables
    envVars:
      - key: PORT
        value: 8080
      - key: DB_HOST
        scope: project
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        scope: project
      - key: DB_USER
        scope: project
      - key: DB_PASSWORD
        scope: project
      - key: JAVA_OPTS
        value: "-Xmx512m -Xms256m"
    
    # Health check
    healthCheckPath: /
    
    # Auto-deploy on push
    autoDeploy: true

  - type: pserv
    name: tp7-postgres
    env: docker
    plan: free
    region: ohio
    
    # PostgreSQL Docker image
    image:
      fromRegistry: true
      fromRegistryUrl: postgres:18-alpine
    
    # Environment variables for PostgreSQL
    envVars:
      - key: POSTGRES_DB
        value: TP02Deploy
      - key: POSTGRES_USER
        scope: project
      - key: POSTGRES_PASSWORD
        scope: project
    
    # Volume for data persistence
    disk:
      name: postgres-data
      mountPath: /var/lib/postgresql/data
      sizeGB: 10
