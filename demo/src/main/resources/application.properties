spring.application.name=TP7
server.port=${PORT:8081}

# PostgreSQL Configuration - Render Database
spring.datasource.url=jdbc:postgresql://dpg-d4j2mcuuk2gs73bb92qg-a:5432/tp08
spring.datasource.username=tp08_user
spring.datasource.password=MuXJqS0iix0uvFIYvSpr7mzsQkEblhwz
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Settings (important for Render)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

# Flyway Configuration for Database Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# Logging Configuration
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.com.zaxxer.hikari=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Production Settings
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
```

## Key Changes Explained:

1. **`DATABASE_URL` support**: Render provides this automatically - it's the primary connection string
2. **Connection pooling**: Added HikariCP settings optimized for free tier (max 5 connections)
3. **`spring.jpa.show-sql`**: Now reads from environment variable, defaults to `false` for production
4. **`spring.jpa.open-in-view=false`**: Better performance, prevents lazy loading issues
5. **Logging**: Set to `INFO` level for production (change to `DEBUG` locally if needed)
6. **Profile support**: Can switch between `dev` and `prod` profiles

## Environment Variables to Set in Render:

When you create your web service, add these in the **Environment** section:

### Required:
```
DATABASE_URL=<paste your Internal Database URL from Render PostgreSQL>
```

The Internal Database URL looks like:
```
postgresql://myapp_user:password123@dpg-xxxxx-a.oregon-postgres.render.com/myapp_db
```

### Optional (for fine-tuning):
```
SPRING_PROFILES_ACTIVE=prod
SHOW_SQL=false
JAVA_OPTS=-Xmx512m -Xms256m